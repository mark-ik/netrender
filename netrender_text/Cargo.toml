[package]
name = "netrender_text"
version = "0.1.0"
license = "MPL-2.0"
repository = "https://github.com/merely-made/netrender"
readme = "../README.md"
description = "parley → netrender::Scene glyph-run adapter"
edition = "2021"

[dependencies]
netrender = { version = "0.1.0", path = "../netrender" }
parley.workspace = true

[dev-dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
